<!DOCTYPE html>
<html lang="es">

  <meta charset="UTF-8" />

  <title>GrafiQuiz · 1º de secundaria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #102033;
      --sheet: #183049;
      --well: #0c1a2c;
      --ink: #f4f7fb;
      --muted: #b7c6d8;
      --line: #2c4666;
      --accent: #ffb703;
      --accent-ink: #1c1403;
      --good: #7dffa1;
      --good-soft: #143528;
      --bad: #ffb4a8;
      --bad-soft: #3a1c22;
      --barras: #ff8a3d; --barras-ink: #2a1204;
      --circular: #ffe14a; --circular-ink: #2a2204;
      --poligono: #3ddec8; --poligono-ink: #042824;
      --rango: #ff6b6b; --rango-ink: #2a0808;
      --media: #7eb6ff; --media-ink: #061428;
      --moda: #ff7eb3; --moda-ink: #2a0816;
      --mediana: #8ee86a; --mediana-ink: #06200c;
      --c1: #ff8a3d; --c2: #3ddec8; --c3: #ffe14a; --c4: #ff7eb3; --c5: #7eb6ff;
      --font-sans: "Outfit", system-ui, sans-serif;
      --font-display: "Fraunces", Georgia, serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--font-sans);
      background-color: var(--paper);
      background-image:
        linear-gradient(to right, color-mix(in srgb, var(--ink) 8%, transparent) 1px, transparent 1px),
        linear-gradient(to bottom, color-mix(in srgb, var(--ink) 8%, transparent) 1px, transparent 1px);
      background-size: 28px 28px;
      line-height: 1.5;
    }
    h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; }
    button { font-family: inherit; cursor: pointer; border: none; }
    button:disabled { cursor: not-allowed; opacity: 0.5; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .wrap { max-width: 48rem; margin: 0 auto; padding: 2rem 1rem; min-height: 100vh; display: flex; flex-direction: column; }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 1.5rem; }
    .logo {
      display: flex; align-items: center; gap: 0.5rem;
      background: var(--sheet); color: var(--ink); border-radius: 999px;
      padding: 0.5rem 0.75rem; border: 1px solid var(--line);
    }
    .logo-icon {
      width: 2.25rem; height: 2.25rem; border-radius: 999px;
      background: var(--accent); color: var(--accent-ink);
      display: flex; align-items: center; justify-content: center;
    }
    .logo-title { font-family: var(--font-display); font-size: 1.125rem; line-height: 1; display: block; }
    .logo-sub { font-size: 0.75rem; color: var(--muted); }
    .badge {
      background: var(--sheet); border: 1px solid var(--line); border-radius: 999px;
      padding: 0.5rem 0.75rem; font-size: 0.875rem; font-weight: 600;
    }
    .card {
      background: var(--sheet); border: 1px solid var(--line); border-radius: 1.5rem;
      padding: 1.25rem; color: var(--ink);
    }
    @media (min-width: 640px) { .card { padding: 1.75rem; } }
    .title { font-size: 1.75rem; margin-bottom: 0.5rem; }
    .muted { color: var(--muted); }
    .input {
      width: 100%; background: var(--well); border: 1px solid var(--line);
      border-radius: 1rem; padding: 0.875rem 1rem; color: var(--ink);
      font-size: 1rem; margin-top: 0.5rem;
    }
    .input::placeholder { color: var(--muted); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      min-height: 3rem; border-radius: 999px; padding: 0 1.25rem;
      font-weight: 600; font-size: 1rem; transition: transform 0.1s;
    }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn-accent { background: var(--accent); color: var(--accent-ink); }
    .btn-ghost { background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
    .btn-block { width: 100%; }
    .topics { display: grid; gap: 0.75rem; margin-top: 1.25rem; }
    @media (min-width: 640px) { .topics { grid-template-columns: 1fr 1fr; } }
    .topic-btn {
      text-align: left; background: var(--well); border: 1px solid var(--line);
      border-radius: 1.25rem; padding: 1rem; color: var(--ink);
      display: flex; flex-direction: column; gap: 0.35rem;
    }
    .topic-btn:hover { border-color: var(--accent); }
    .topic-chip {
      display: inline-flex; border-radius: 999px; padding: 0.2rem 0.6rem;
      font-size: 0.75rem; font-weight: 600; width: fit-content;
    }
    .tone-barras { background: var(--barras); color: var(--barras-ink); }
    .tone-circular { background: var(--circular); color: var(--circular-ink); }
    .tone-poligono { background: var(--poligono); color: var(--poligono-ink); }
    .tone-rango { background: var(--rango); color: var(--rango-ink); }
    .tone-media { background: var(--media); color: var(--media-ink); }
    .tone-moda { background: var(--moda); color: var(--moda-ink); }
    .tone-mediana { background: var(--mediana); color: var(--mediana-ink); }
    .progress-wrap { margin-bottom: 1rem; }
    .progress-bar {
      height: 0.5rem; background: var(--well); border-radius: 999px; overflow: hidden;
    }
    .progress-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.25s; }
    .progress-label { font-size: 0.875rem; color: var(--muted); margin-bottom: 0.35rem; display: flex; justify-content: space-between; }
    .figure-box {
      background: var(--well); border-radius: 1.25rem; padding: 0.75rem;
      margin: 1rem 0; border: 1px solid var(--line);
    }
    .options { display: flex; flex-direction: column; gap: 0.65rem; margin-top: 1rem; }
    .opt {
      text-align: left; background: var(--well); border: 2px solid var(--line);
      border-radius: 1rem; padding: 0.9rem 1rem; color: var(--ink); font-weight: 500;
    }
    .opt.selected { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 15%, var(--well)); }
    .opt.correct { border-color: var(--good); background: var(--good-soft); }
    .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
    .opt:disabled { opacity: 1; }
    .explain {
      margin-top: 1rem; padding: 1rem; border-radius: 1rem;
      background: var(--well); border: 1px solid var(--line); font-size: 0.95rem;
    }
    .actions { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1.25rem; }
    @media (min-width: 640px) { .actions { flex-direction: row; } }
    .actions .btn { flex: 1; }
    .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; padding: 0.75rem; }
    .chip {
      width: 3rem; height: 3rem; border-radius: 1rem;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-size: 1.5rem; font-weight: 700;
    }
    .chip:nth-child(7n+1) { background: var(--barras); color: var(--barras-ink); }
    .chip:nth-child(7n+2) { background: var(--circular); color: var(--circular-ink); }
    .chip:nth-child(7n+3) { background: var(--poligono); color: var(--poligono-ink); }
    .chip:nth-child(7n+4) { background: var(--media); color: var(--media-ink); }
    .chip:nth-child(7n+5) { background: var(--moda); color: var(--moda-ink); }
    .chip:nth-child(7n+6) { background: var(--mediana); color: var(--mediana-ink); }
    .chip:nth-child(7n) { background: var(--rango); color: var(--rango-ink); }
    table.fig { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    table.fig th { color: var(--accent); padding: 0.5rem 0.75rem; font-weight: 600; }
    table.fig td { padding: 0.5rem 0.75rem; border-top: 1px solid var(--line); }
    table.fig td:last-child, table.fig th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    .meme {
      aspect-ratio: 1; width: 100%; border-radius: 1.5rem;
      object-fit: cover; display: block;
      border: 1px solid var(--line); margin-top: 1.25rem;
    }
    .meme-line { margin-top: 1rem; font-size: 1.05rem; color: var(--ink); }
    .score-big { font-family: var(--font-display); font-size: 3rem; font-weight: 700; }
    .record { display: inline-flex; align-items: center; gap: 0.35rem; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0.35rem 0.75rem; font-size: 0.875rem; font-weight: 600; margin-top: 0.75rem; }
    .miss-list { margin-top: 1rem; display: flex; flex-direction: column; gap: 1rem; }
    .miss-item { border-top: 1px solid var(--line); padding-top: 1rem; }
    .miss-item:first-child { border-top: none; padding-top: 0; }
    .text-good { color: var(--good); }
    .text-bad { color: var(--bad); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    .gap-sm { margin-top: 0.5rem; }
    .gap-md { margin-top: 1rem; }
    .gap-lg { margin-top: 1.5rem; }
    .stack { display: flex; flex-direction: column; gap: 1rem; }
    .home-intro { font-size: 1.05rem; color: var(--muted); margin-bottom: 1rem; }
  </style>
